<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>モンブラン日記</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero__badge">
        <span class="hero__ornament hero__ornament--left" aria-hidden="true">♡</span>
        <span class="hero__ornament hero__ornament--right" aria-hidden="true">♡</span>
        <span class="hero__leaf hero__leaf--left" aria-hidden="true">❦</span>
        <span class="hero__leaf hero__leaf--right" aria-hidden="true">❦</span>
        モンブラン日記
      </div>
      <p class="hero__subtitle">Presented by your dearest Lemon <span class="hero__lemon" aria-hidden="true">🍋</span></p>
    </header>

    <main class="page-stack">
      <section class="page page--active" id="weight-page" data-page="weight" aria-label="体重监控">
        <section class="card">
          <div class="card__head">
            <div>
              <h2>体重变化趋势</h2>
              <p class="muted">单位：g</p>
            </div>
            <div class="head-actions">
              <button class="ghost-button" id="range-toggle" type="button" aria-live="polite">切换到月视图</button>
              <button class="primary-button" id="add-record-button" type="button">新增记录</button>
            </div>
          </div>

          <div class="chart-panel">
            <svg id="weight-chart" viewBox="0 0 640 190" aria-label="体重走势图" role="img"></svg>
            <div class="chart-empty hidden" id="chart-empty">尚无记录</div>
          </div>

          <div class="table-wrap">
            <table class="record-table">
              <thead>
                <tr>
                  <th>日期</th>
                  <th>体重</th>
                  <th>增量</th>
                  <th>兔粮量</th>
                  <th>备注</th>
                </tr>
              </thead>
              <tbody id="record-table-body"></tbody>
            </table>
          </div>
          <div class="empty-inline hidden" id="table-empty">尚无记录</div>
        </section>
      </section>

      <section class="page" id="calendar-page" data-page="calendar" aria-label="日历和摘要">
        <div class="record-grid">
          <section class="card">
            <div class="card__head">
              <div class="calendar-head-main">
                <h2>日历</h2>
                <button class="ghost-button calendar-mode-button" id="calendar-mode-toggle" type="button">展开月历</button>
              </div>
              <div class="calendar-nav">
                <button class="icon-button" id="prev-month" type="button" aria-label="上个月">&lsaquo;</button>
                <span id="calendar-title"></span>
                <button class="icon-button" id="next-month" type="button" aria-label="下个月">&rsaquo;</button>
              </div>
            </div>
            <div class="calendar" id="calendar"></div>
          </section>

          <section class="card">
            <div class="card__head">
              <h2>摘要</h2>
              <button class="ghost-button hidden" id="edit-selected-record" type="button">编辑当天</button>
            </div>
            <div class="detail-card" id="record-detail"></div>
          </section>
        </div>
      </section>

      <section class="page" id="weather-page" data-page="weather" aria-label="温度监控">
        <section class="card">
          <div class="card__head">
            <div>
              <h2>温度监控</h2>
            </div>
          </div>

          <div class="city-picker">
            <label class="city-picker__label" for="prefecture-select">地区选择</label>
            <div class="city-picker__row">
              <select id="prefecture-select" aria-label="都道府県选择"></select>
              <select id="municipality-select" aria-label="市町村选择"></select>
            </div>
          </div>

          <div class="weather-status hidden" id="weather-error"></div>
          <div class="weather-grid hidden" id="weather-grid">
            <article class="weather-card weather-card--warm" id="today-card">
              <div class="weather-card__top">
                <div class="weather-card__content">
                  <div class="alert-badge" id="today-alert"></div>
                  <h3>今日</h3>
                  <div class="weather-icon" id="today-icon"></div>
                  <div class="weather-temp" id="today-temp"></div>
                  <div class="weather-text" id="today-text"></div>
                  <div class="weather-range" id="today-range"></div>
                </div>
                <div class="bunny-sprite weather-bunny" id="today-bunny"></div>
              </div>
            </article>
            <article class="weather-card weather-card--cool" id="tomorrow-card">
              <div class="weather-card__top">
                <div class="weather-card__content">
                  <div class="alert-badge" id="tomorrow-alert"></div>
                  <h3>明日</h3>
                  <div class="weather-icon" id="tomorrow-icon"></div>
                  <div class="weather-temp" id="tomorrow-temp"></div>
                  <div class="weather-text" id="tomorrow-text"></div>
                  <div class="weather-range" id="tomorrow-range"></div>
                </div>
                <div class="bunny-sprite weather-bunny" id="tomorrow-bunny"></div>
              </div>
            </article>
          </div>
        </section>
      </section>

      <section class="page" id="checklist-page" data-page="checklist" aria-label="待办事项">
        <section class="card">
          <div class="card__head">
            <div class="checklist-head-main">
              <div>
                <h2>待办事项</h2>
                <p class="muted" id="checklist-summary"></p>
              </div>
              <button class="ghost-button" id="edit-checklist-button" type="button">编辑</button>
            </div>
            <div class="checklist-head-actions">
              <div class="checklist-status-bunny bunny-sprite" id="checklist-status-bunny" aria-hidden="true"></div>
            </div>
          </div>
          <div class="checklist-list" id="checklist-list"></div>
        </section>
      </section>
    </main>

    <footer class="bottom-nav">
      <button class="bottom-nav__item bottom-nav__item--active" type="button" data-nav-target="weight">
        <span>体重</span>
      </button>
      <button class="bottom-nav__item" type="button" data-nav-target="calendar">
        <span>日历</span>
      </button>
      <button class="bottom-nav__item" type="button" data-nav-target="weather">
        <span>温度</span>
      </button>
      <button class="bottom-nav__item" type="button" data-nav-target="checklist">
        <span>待办</span>
      </button>
    </footer>
  </div>

  <dialog class="modal" id="record-modal">
    <form class="modal__panel" id="record-form" method="dialog">
      <div class="modal__head">
        <h2 id="modal-title">新增今日记录</h2>
        <button class="icon-button" id="close-modal" type="button" aria-label="关闭">&times;</button>
      </div>

      <label class="field">
        <span>摘要</span>
        <input id="record-title-input" name="title" maxlength="40">
      </label>

      <label class="field">
        <span>体重（g）</span>
        <input id="record-weight-input" name="weight" type="number" min="1" step="1" inputmode="numeric" required>
      </label>

      <label class="field">
        <span>详情记录</span>
        <textarea id="record-detail-input" name="detail" rows="5" maxlength="500"></textarea>
      </label>

      <div class="field">
        <span>图片</span>
        <div class="image-picker">
          <input id="record-image-input" type="file" accept="image/*">
          <div class="image-preview hidden" id="image-preview-wrap">
            <img id="image-preview" alt="记录图片预览">
            <button class="ghost-button" id="replace-image-button" type="button">替换图片</button>
          </div>
          <p class="muted">可从相册选择 1 张图片，保存后长期保留。</p>
        </div>
      </div>

      <div class="modal__actions">
        <button class="ghost-button" id="cancel-modal" type="button">取消</button>
        <button class="primary-button" id="save-record-button" type="submit">保存记录</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="checklist-modal">
    <div class="modal__panel">
      <div class="modal__head">
        <h2>编辑待办事项</h2>
        <button class="icon-button" id="close-checklist-modal" type="button" aria-label="关闭">&times;</button>
      </div>

      <div class="checklist-editor">
        <section class="checklist-editor__list">
          <div class="checklist-editor__topbar">
            <h3>条目列表</h3>
            <button class="primary-button" id="new-checklist-item-button" type="button">新增条目</button>
          </div>
          <div class="checklist-manage-list" id="checklist-manage-list"></div>
        </section>

        <section class="checklist-editor__form">
          <form id="checklist-item-form">
            <label class="field">
              <span>List 内容</span>
              <input id="checklist-item-label" maxlength="60" required>
            </label>

            <label class="field field--inline">
              <span>是否重复</span>
              <input id="checklist-item-repeatable" type="checkbox" checked>
            </label>

            <label class="field" id="checklist-repeatable-field">
              <span>重复周期</span>
              <select id="checklist-item-period">
                <option value="daily">每日</option>
                <option value="weekly">每周</option>
                <option value="biweekly">每两周</option>
                <option value="bimonthly">每两月</option>
              </select>
            </label>

            <div class="field-group hidden" id="checklist-date-range-fields">
              <label class="field">
                <span>开始日期</span>
                <input id="checklist-item-start-date" type="date">
              </label>
              <label class="field">
                <span>结束日期</span>
                <input id="checklist-item-end-date" type="date">
              </label>
            </div>

            <div class="modal__actions">
              <button class="ghost-button" id="delete-checklist-item-button" type="button">删除条目</button>
              <button class="primary-button" id="save-checklist-item-button" type="submit">保存条目</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
